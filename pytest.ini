[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    live: tests that talk to a real Bittensor network (opt in with CHIPFORGE_LIVE_TESTS=1)
    crossenv: tests that shell out to the challenge-server conda env (skipped if absent)
